<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Registration Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #f8f9fa;
            border-bottom: 1px solid #ccc;
            padding: 10px 20px;
        }
        .navbar a {
            margin-right: 20px;
            text-decoration: none;
            color: #000;
            font-size: 16px;
        }
        .navbar a:hover {
            color: #007bff;
        }

        .login-container {
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 20px;
            width: 300px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 20px;
            color: #333;
        }

        .login-form {
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 15px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: #999;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #666;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 5px;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .forgot-password {
            font-size: 14px;
            color: #666;
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .login-button {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 3px;
            font-size: 14px;
            cursor: pointer;
        }

        .login-button:hover {
            background-color: #0056b3;
        }
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #fff;
            border-top: 1px solid #d1d5db;
            padding: 8px 0;
            z-index: 1000;
        }
        .footer .container {
            margin: 0 auto;
            text-align: center;
        }
        .footer p {
            color: #6b7280; 
            margin: 0;
            font-size: 14px;
        }
    </style>
</head>

<body class="flex flex-col items-center justify-center min-h-screen bg-gray-100">
    <!-- Navigation -->
    <div class="navbar">
        <div class="container mx-auto text-center">
            <a href="#" class="mx-2 text-gray-600">Home</a>
            <span class="mx-2 text-black">|</span>
            <a href="login.html" class="mx-2 text-black font-bold">Đăng nhập</a>
            <span class="mx-2 text-black">|</span>
            <a href="register.html" class="mx-2 text-gray-600">Đăng ký</a>
        </div>
    </div>

    <!-- Login Form -->
    <div class="login-container">
        <h2>Màn hình đăng nhập</h2>
        <form class="login-form">
            <div class="form-group">
                <input type="text" id="username" name="username" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" name="password" placeholder="Mật khẩu" required>
            </div>
            <div class="form-group checkbox-group">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Ghi nhớ đăng nhập</label>
            </div>
            <div class="form-group button-group">
                <a href="#" class="forgot-password">Quên mật khẩu</a>
                <button type="submit" class="login-button">Đăng nhập</button>
            </div>
        </form>
    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="container">
            <p>Lập trình web @01/2025</p>
        </div>
    </div>
</body>

</html>
